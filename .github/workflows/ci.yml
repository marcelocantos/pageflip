name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: macos-14
    steps:
      # meetcat/go.mod carries `replace github.com/marcelocantos/claudia =>
      # ../../claudia`, so claudia must sit beside the pageflip checkout for
      # the Go leg of `make gate` to resolve.
      - uses: actions/checkout@v6
        with:
          path: pageflip

      - uses: actions/checkout@v6
        with:
          repository: marcelocantos/claudia
          path: claudia

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: pageflip/meetcat/go.mod

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pageflip/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('pageflip/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run the gate
        working-directory: pageflip
        run: make gate
