# hygiene.yaml — declared, drift-validated hygiene posture for pageflip.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`. Tracks
# steady-state ("we maintain X"), the complement to bullseye's aspirational
# targets ("achieve X").
#
# Tiers are PER DIMENSION (schema v1): a dimension's held tier is the highest T
# such that every item in it with tier <= T is satisfied. `floors` is the
# per-dimension ratchet (below floor => DRIFT); `aspires` is the gap horizon;
# `enforce` is intent-only and does not affect tiers.

schema_version: 1

repo: pageflip
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 2   # cargo test in macos-14 CI; Go tests exist but are not gated
  security: 2      # Cargo.lock + go.sum pinning; scanners are T3 planned
  quality: 2       # rustfmt + clippy -D warnings via make bullseye
  deps: 2          # committed Cargo.lock and meetcat/go.sum
  release: 2       # tag-triggered release.yml + Homebrew tap
  governance: 2    # Apache-2 LICENSE, README, .gitignore, squash-only
  build: 2         # edition/rust-version/go pin + cargo cache in CI
  docs: 1          # STABILITY.md + CONTRIBUTING; no docs CI / agents-guide
  perf: 0          # no benchmark suite
  vcs: 0           # no committed git hooks
  agent: 2         # CLAUDE.md + bullseye.yaml; no AGENTS.md

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # fmt+clippy enforced, macos CI, release + governance
  3: hardened    # security scanning, signing, fuzzing, Go gate, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: cargo test --release runs on every push/PR via make bullseye
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_step: {workflow: ci.yml, name: Run bullseye invariants}}

  - id: correctness.macos-ci
    dim: correctness
    desc: CI runs on macos-14, the only supported platform
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: .github/workflows/ci.yml, matches: 'macos-14'}}

  - id: correctness.go-tests
    dim: correctness
    desc: meetcat Go tests run in the same CI gate as the Rust crate
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: >-
      meetcat/ has *_test.go sources, but Makefile bullseye on this branch is
      Rust-only (fmt clippy build test) and ci.yml does not set up Go.
    evidence: {absent: {make_target: go-test}}

  - id: correctness.windows
    dim: correctness
    desc: Windows CI / supported Windows build
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      Product is macOS-only (ScreenCaptureKit). release.yml comment records
      T6/T7 linux/windows targets deleted; ci.yml has no Windows runner.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'windows-'}}}

  - id: correctness.linux
    dim: correctness
    desc: Linux CI test runner
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      Capture depends on macOS ScreenCaptureKit. ci.yml is macos-14 only;
      ubuntu-latest in release.yml is the publish job, not a test matrix.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'ubuntu-'}}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harnesses over NDJSON events / policy / PII redaction parsers
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Unit tests cover parsers; no cargo-fuzz / go-fuzz targets or corpus.
    evidence: {absent: {file: {path: fuzz}}}

  - id: correctness.miri
    dim: correctness
    desc: UB checking (miri) over any unsafe code
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      Capture uses ScreenCaptureKit / objc FFI at the edges; clippy + tests
      are the current net. miri is not wired.
    evidence: {absent: {ci_job: ci.yml#miri}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.dep-pinning
    dim: security
    desc: Cargo.lock committed — reproducible, pinned Rust dependency graph
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: Cargo.lock}}

  - id: security.go-sum
    dim: security
    desc: meetcat/go.sum committed — pinned Go module graph
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: meetcat/go.sum}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: enforced
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: .github/workflows/ci.yml, matches: '(?m)^permissions:'}}

  - id: security.dep-audit
    dim: security
    desc: RustSec advisory scanning of the locked deps (cargo-audit / cargo-deny)
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: Cargo.lock is pinned but no automated RustSec advisory check runs.
    evidence: {absent: {scanner: {tool: cargo-audit}}}

  - id: security.secret-scan
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: No gitleaks config; relying on manual review.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis for the Go orchestrator
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      CodeQL has no Rust analysis; Go in meetcat/ is a CodeQL-supported
      language but no codeql job exists yet.
    evidence: {absent: {ci_job: ci.yml#codeql}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore / notarized)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      README documents that pre-built binaries are not code-signed (needs an
      Apple Developer account). release.yml uploads via action-gh-release with
      no signing step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  # ============================== CODE QUALITY ============================
  - id: quality.format
    dim: quality
    desc: Sources are rustfmt-clean, enforced in CI (cargo fmt --check)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {make_target: fmt}

  - id: quality.lint
    dim: quality
    desc: clippy clean with warnings denied (cargo clippy -- -D warnings)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {make_target: clippy}

  - id: quality.local-gate
    dim: quality
    desc: Makefile bullseye target runs fmt, clippy, release build, and tests
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {make_target: bullseye}

  - id: quality.go-vet
    dim: quality
    desc: go vet / gofmt check for meetcat/ in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: Makefile has no go-vet or gofmt target; bullseye is Rust-only.
    evidence: {absent: {make_target: go-vet}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.cargo-lock
    dim: deps
    desc: Cargo.lock lockfile is committed
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: Cargo.lock}}

  - id: deps.go-sum
    dim: deps
    desc: meetcat/go.sum lockfile is committed
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: meetcat/go.sum}}

  - id: deps.dependabot
    dim: deps
    desc: Automated dependency-update PRs (Dependabot or Renovate)
    state: planned
    cadence: periodic:30d
    enforce: informational
    tier: 3
    reason: No .github/dependabot.yml; updates are manual at release time.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.semver
    dim: release
    desc: Cargo.toml version matches the latest git tag
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: >-
        test "$(grep -m1 -E '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
        = "$(git describe --tags --abbrev=0 | tr -d v)"

  - id: release.ci-built
    dim: release
    desc: Release binaries are built by CI (macos-14 arm64), never locally
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release via tapper (scripts/release-tap.sh → tapper push)
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {file: {path: scripts/release-tap.sh, matches: 'tapper push'}}

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers target/, IDE/OS files, agent state, meeting artefacts
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.contributing
    dim: governance
    desc: CONTRIBUTING.md documents the local gate and the audio invariant
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: CONTRIBUTING.md}}

  - id: governance.issue-templates
    dim: governance
    desc: GitHub issue templates exist (bug report + feature request)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: .github/ISSUE_TEMPLATE/bug_report.yml}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.notice
    dim: governance
    desc: Third-party attribution NOTICE for crate and Go module dependencies
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: No NOTICE for dependency attributions yet.
    evidence: {absent: {file: {path: NOTICE}}}

  # ================================= BUILD ===============================
  - id: build.ci
    dim: build
    desc: cargo build --release runs in CI via make bullseye
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_job: ci.yml#bullseye}

  - id: build.edition-pinned
    dim: build
    desc: Rust edition pinned (edition = "2021")
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: Cargo.toml, matches: 'edition = "2021"'}}

  - id: build.rust-version
    dim: build
    desc: MSRV declared (rust-version = "1.75")
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: Cargo.toml, matches: 'rust-version = "1.75"'}}

  - id: build.go-version
    dim: build
    desc: Go toolchain version pinned in meetcat/go.mod
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: meetcat/go.mod, matches: '(?m)^go 1\.26'}}

  - id: build.reproducible-lock
    dim: build
    desc: Committed Cargo.lock makes the Rust dependency graph reproducible
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: Cargo.lock}}

  - id: build.ci-cache
    dim: build
    desc: CI caches cargo registry, git, and target/
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence: {file: {path: .github/workflows/ci.yml, matches: 'actions/cache@'}}

  # ============================ DOCUMENTATION ============================
  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the pre-1.0 interaction surface
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: STABILITY.md}}

  - id: docs.agents-guide
    dim: docs
    desc: agents-guide.md documents binary invocation for coding agents
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: No root agents-guide.md on this branch; only src/help_agent.txt.
    evidence: {absent: {file: {path: agents-guide.md}}}

  - id: docs.rustdoc
    dim: docs
    desc: cargo doc builds cleanly in CI (no broken intra-doc links)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Docs are not built in CI yet.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Docs}}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No check-md-links (or equivalent) target/job yet.
    evidence: {absent: {make_target: check-md-links}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite exists (Criterion or go test -bench)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: No benches/ directory and no make bench target.
    evidence: {absent: {file: {path: benches}}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (project conventions discoverable by agents)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.help-agent
    dim: agent
    desc: Capture binary ships --help-agent text (src/help_agent.txt)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: src/help_agent.txt}}

  - id: agent.agents-md
    dim: agent
    desc: AGENTS.md present (shared multi-tool project instructions)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: Only CLAUDE.md exists; no AGENTS.md at repo root.
    evidence: {absent: {file: {path: AGENTS.md}}}
